name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check, test and build release
        run: npm run build

      - name: Build development version
        run: npm run build:dev

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-time-machine-release
          path: |
            dist/extension/
            dist/userscript/
          if-no-files-found: error

      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-time-machine-dev
          path: dist/dev/
          if-no-files-found: error
