name: Release packages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      draft: ${{ steps.version.outputs.draft }}
      target: ${{ steps.version.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for an unpublished version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Package version must use X.Y.Z" >&2
            exit 1
          fi
          tag="v$version"
          release=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$tag\") | [.draft, .target_commitish] | @tsv")
          IFS=$'\t' read -r draft target <<< "$release"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [[ "$draft" == "false" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already published; skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.target || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reuse an existing tag on retry
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git checkout --detach "refs/tags/$RELEASE_TAG"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check, test and build
        run: npm run build

      - name: Check release versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const json = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Release tag must use vX.Y.Z');
          const version = tag.slice(1);
          const lock = json('package-lock.json');
          const versions = {
            package: json('package.json').version,
            lock: lock.version,
            lockRoot: lock.packages[''].version,
            extension: json('dist/extension/manifest.json').version,
            userscript: readFileSync('dist/userscript/bilibili-time-machine.user.js', 'utf8').match(/^\/\/\s*@version\s+(\S+)/m)?.[1],
          };
          for (const [name, actual] of Object.entries(versions)) {
            if (actual !== version) throw new Error(`${name}: ${actual} does not match ${tag}`);
          }
          NODE

      - name: Package production outputs
        run: |
          mkdir -p release-assets
          (cd dist/extension && zip -r "../../release-assets/bilibili-time-machine-extension-${RELEASE_TAG}.zip" .)
          (cd dist/userscript && zip "../../release-assets/bilibili-time-machine-userscript-${RELEASE_TAG}.zip" bilibili-time-machine.user.js)
          cp dist/userscript/bilibili-time-machine.user.js release-assets/bilibili-time-machine.user.js

      - name: Create draft, upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXISTING_DRAFT: ${{ needs.check.outputs.draft }}
        run: |
          if [[ "$EXISTING_DRAFT" != "true" ]]; then
            gh release create "$RELEASE_TAG" --target "$(git rev-parse HEAD)" --title "$RELEASE_TAG" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
